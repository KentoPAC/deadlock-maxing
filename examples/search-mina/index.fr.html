function buildPanel(b){
  // the game does not import the build description on paste: a second button copies it for its own field
  const btn='<span class="copy-row">'+(b.code?`<button class="copy cham" data-code="${esc(b.code)}">${L('copy.label')}</button>`
    :`<button class="copy cham" disabled title="${L('copy.todo_title')}">${L('copy.todo')}</button>`)
    +(b.code&&b.desc?`<button class="copy copy--sub cham" data-code="${esc(b.desc)}" data-label="${esc(L('copy.desc'))}" data-ok="${esc(L('copy.desc_ok'))}" title="${esc(L('copy.desc_title'))}">${L('copy.desc')}</button>`:'')+'</span>';
  let nn=0;const nTotal=b.cats.reduce((a,c)=>a+c.mods.filter(m=>m.note).length,0);
  const cats=`<div class="cats-bar"><h3>${L('bp.items')}</h3>${nTotal?`<button type="button" class="notes-btn" aria-pressed="${NOTES}">${L('bp.notes',{n:nTotal})}</button>`:''}</div>
  <div class="cats"><div class="cats__in" style="--rw:${(D.gameRow||{}).w||1060};--gap:${(D.gameRow||{}).gap||10}">`+(CUR_IDS=new Set(b.cats.flatMap(c=>c.mods.map(m=>+m.id))),'')+b.cats.map(c=>{const nums=c.mods.map(m=>m.note?++nn:0);
    const notes=c.mods.map((m,k)=>m.note?`<li><span>${nums[k]}</span><span><b>${esc(T(m.id).n||'')}</b> — ${lk(m.note)}</span></li>`:'').join('');
    // the game's layout: rows of --rw units, each category at the width the game gives it (apply.py pack)
    const w=c.width?`--w:${c.width}`:'--w:var(--rw)';
    return `<section class="catp${c.optional?' catp--opt':''}" style="${w}"><div class="catp__h">${esc(catName(c.name))}${c.optional?`<span class="opt">${L('cat.optional')}</span>`:''}</div>`
    +(c.desc?`<p class="catp__d">${lk(c.desc)}</p>`:'')
    +(c.mods.length?`<div class="mods">${c.mods.map((m,k)=>modCard(m,nums[k])).join('')}</div>`:'')
    +(notes?`<ol class="catp__notes">${notes}</ol>`:'')+'</section>'}).join('')+'</div></div>';
  return `<article class="panel"><div class="panel__top"><div>
    <p class="panel__src">${esc(srcName(b.source))} <span>· ${esc(b.sourceInfo)}</span></p><h2>${esc(b.name)}</h2>
    <p class="facts">${L('bp.by')} <b>${esc(b.author)}</b>${b.buildId?` · build <span class="num">${b.buildId}</span>`:''}${b.translated?'':L('bp.untranslated')}</p>
    ${b.video?`<p class="facts">${L('build.video')} ${vlink(b.video.id,b.video.t,`${esc(b.video.author)}, « ${esc(b.video.title)} » (${ts(b.video.t)})`)}</p>`:''}</div>${btn}</div>
    ${statStrip(b)}${takeBlock(b)}${playSection(b)}${counterSection(b)}${b.desc?`<p class="authordesc">${lk(b.desc)}</p>`:''}${cats}${abilityGrid(b.order)}${b.footer?`<footer class="bfoot">${b.footer.split('\n').map((l,i)=>i?`<p>${esc(l)}</p>`:`<p class="bfoot__mark">${esc(l)}</p>`).join('')}</footer>`:''}</article>`}
// In-game preview: categories drawn at the size stored in the code, scaled to the game's build area
/* ---- comparison ---- */
const KW=[[/situ|option|util|selon|counter|contre|si /i,'Situ.',8],[/late|fin de partie|tardi|endgame/i,'Late',2],
  [/mid|milieu/i,'Mid',1],[/early|lane|début|premier|core|base|start/i,'Early',0]];
function phaseOf(c,idx){const n=PH[c.name]?c.name:catName(c.name);if(PH[n])return[PH[n].replace(' game',''),idx];
  for(const[re,lab,r]of KW)if(re.test(n))return[lab,r];return[`Cat. ${idx+1}`,idx+0.5]}
function comparePanel(){
  const rows={};D.builds.forEach((b,bi)=>b.cats.forEach((c,ci)=>{const[lab,rank]=phaseOf(c,ci);
    c.mods.forEach(m=>{const r=rows[m.id]=rows[m.id]||{id:m.id,cells:{},rank:0,n:0};
      if(r.cells[bi]==null){r.cells[bi]={lab,full:catName(c.name),p:rank,raw:c.name};r.n++;r.rank+=rank}})}));
  const N=D.builds.length,list=Object.values(rows).sort((a,b)=>b.n-a.n||a.rank/a.n-b.rank/b.n);
  const head=`<tr><th>${L('cmp.item')}</th>`+D.builds.map(b=>`<th>${esc(b.author)}${flag(buildFresh(b))}<small>${esc(srcName(b.source))}${b.winrate!=null?` · <span class="wr-${wrTone(b.winrate)}">${L('wr.short',{n:b.winrate})}</span>`:''}</small></th>`).join('')+`<th class="cnt">${L('cmp.builds')}</th></tr>`;
  const body=list.map(r=>`<tr class="${r.n===N?'all':''}"><th><div tabindex="0" data-id="${r.id}">${img(r.id)}${esc(T(r.id).n||r.id)}</div></th>`
    +D.builds.map((_,bi)=>{const c=r.cells[bi];return c?`<td class="ph" data-p="${c.p<3?0:1}" title="${esc(c.full)}">${esc(c.lab)}${PH[c.raw]||/^Situ/.test(c.raw||'')?'':'<i>*</i>'}</td>`:'<td class="none">—</td>'}).join('')
    +`<td class="cnt num">${r.n}/${N}</td></tr>`).join('');
  const styled=D.builds.some(b=>b.play&&b.play.focus);
  const style=styled?['Early','Mid','Late'].map((ph,i)=>`<tr class="cmp-style"><th>${L('focus.title')} · ${ph}</th>`+D.builds.map(b=>{const f=b.play&&b.play.focus&&b.play.focus[i];
    return f?`<td>${leanTxt(f)}</td>`:'<td class="none">—</td>'}).join('')+'<td class="cnt"></td></tr>').join(''):'';
  const common=list.filter(r=>r.n===N).length;
  return `<article class="panel"><p class="panel__src">${L('rail.cmp_src')}</p><h2>${L('cmp.title')}</h2>
   <p class="legend">${L(common>1?'cmp.common_many':'cmp.common_one',{n:common,total:N})} ${L('cmp.legend')}</p>
   <div class="cmp-wrap"><table class="cmp"><thead>${head}</thead><tbody>${style}${body}</tbody></table></div></article>`}

/* ---- data view: measured profile (profiles.py) ---- */
let DT=(()=>{try{return localStorage.getItem('dl-tier')||'ranked'}catch(e){return'ranked'}})();
const nf=(v,d=0)=>Number(v).toLocaleString(LOC,{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(v,d=2)=>(v>=0?'+':'−')+nf(Math.abs(v),d);
const kS=v=>nf(v/1000,v%1000?1:0)+'K';
const dG=()=>D.profile[DT]||D.profile.ranked,dO=()=>D.profile[DT==='ranked'?'top':'ranked'];
const tierName=k=>L(k==='top'?'data.tier_top':'data.tier_all');
const typeOf=sp=>sp.flat||!sp.from?'':sp.to<=20000?'data.type_early':sp.from>=30000?'data.type_late':'data.type_mid';
function minAt(nwq,nw){const p=[[0,0]].concat(Object.entries(nwq||{}).map(([m,v])=>[+m,v[1]]).sort((a,b)=>a[0]-b[0]));
  for(let i=1;i<p.length;i++)if(nw<=p[i][1]&&p[i][1]>p[i-1][1])return p[i-1][0]+(p[i][0]-p[i-1][0])*(nw-p[i-1][1])/(p[i][1]-p[i-1][1]);return null}
// Hover help on any chart mark: HTML kept in data-tt, shown in #tip by bindTips (hover, focus, tap).
const tt=h=>` tabindex="0" data-tt="${esc(h)}"`;
const ttBox=(title,rows,note)=>`<b>${title}</b>${(rows||[]).map(([k,v,c])=>`<div><span>${c?`<i style="background:${c}"></i>`:''}${k}</span><span>${v}</span></div>`).join('')}${note?`<small>${note}</small>`:''}`;
// What a value on the power scale (net kills of his team per 10 min, compared with other heroes) means, in words
const fxSentence=v=>v==null?L('data.tip_none'):Math.abs(v)<.05?L('data.tip_even'):L(v>0?'data.tip_up':'data.tip_down',{v:nf(Math.abs(v),2)});
const pm=(v,se,d)=>sg(v,d)+(se?` <small>± ${nf(2*se,d)}</small>`:'');
// Objectives whose median net worth falls in [a, b)
const objsIn=(nwq,a,b)=>['rift','boss','urn'].flatMap(k=>(D.profile.events[k]||[]).filter(mn=>nwq[mn]&&nwq[mn][1]>=a&&nwq[mn][1]<b).map(mn=>`${OBJ[k][0]} ${L('data.'+k)} ${mn}'`));
// Net worth reached at a given minute (median of his games), interpolated
function nwAt(nwq,mn){const p=[[0,0]].concat(Object.entries(nwq||{}).map(([m,v])=>[+m,v[1]]).sort((a,b)=>a[0]-b[0]));
  for(let i=1;i<p.length;i++)if(mn<=p[i][0])return p[i-1][1]+(p[i][1]-p[i-1][1])*(mn-p[i-1][0])/(p[i][0]-p[i-1][0]);return null}
// "How it is computed": every chart says where its numbers come from, in plain steps, with a real example when possible
const how=(steps,ex)=>`<details class="dv-how"><summary>${L('data.how')}</summary><ol>${steps.map(x=>`<li>${x}</li>`).join('')}</ol>${ex?`<p class="dv-how__ex">${ex}</p>`:''}</details>`;
const fightRef=(g,i)=>g.fights_hero&&g.fights_hero[i]!=null&&g.fights[i]!=null?[g.fights_hero[i],g.fights_hero[i]-g.fights[i]]:null;
const OBJ={rift:['◆','var(--color-accent-hi)'],boss:['●','var(--color-ok)'],urn:['■','var(--color-muted)']};
// diverging bar (CSS): value v on a symmetric scale [-m, m], optional ±2 standard error whisker
function dvBar(v,m,se,tone){const pc=t=>50+Math.max(-1,Math.min(1,t/m))*49,col=tone||(v>=0?'var(--color-accent)':'var(--color-neutral)');
  const a=pc(Math.min(0,v)),b=pc(Math.max(0,v));
  return `<div class="dvb" aria-hidden="true"><span class="dvb__f" style="left:${a}%;width:${Math.max(.8,b-a)}%;background:${col}"></span>${se?`<span class="dvb__e" style="left:${pc(v-2*se)}%;width:${pc(v+2*se)-pc(v-2*se)}%"></span>`:''}<span class="dvb__z"></span></div>`}
const barLegend=()=>`<div class="dv-legend"><span><i style="--c:var(--color-accent)"></i>${L('data.lg_effect')}</span><span><i class="whisk"></i>${L('data.lg_err')}</span><span><i class="zero"></i>${L('data.lg_zero')}</span><span class="dv-legend__hint">${L('data.lg_hover')}</span></div>`;
// Power line shared by the TLDR and the data view. grp: 'ranked' (TLDR) or 'cur' (the tier picked in the data view).
function powerSvg(g,o,o_){const P=D.profile,B=P.buckets,nwq=g.nw_by_minute||{},X1=62500,{W,H,m,mini}=o_,pb=H-m.b;
  const top=Math.max(.5,...g.fights.filter(v=>v!=null).map(Math.abs))*1.2;
  const x=v=>m.l+v/X1*(W-m.l-m.r),y=v=>m.t+(top-v)/(2*top)*(pb-m.t),mid=i=>B[i]+1250;
  const path=c=>{let d='',pen=false;c.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(mid(i)).toFixed(1)+' '+y(v).toFixed(1);pen=true});return d};
  const pts=g.fights.map((v,i)=>v==null?null:[x(mid(i)),y(v)]).filter(Boolean);
  const area=pts.length?`M${pts[0][0]} ${y(0)} `+pts.map(p=>`L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')+` L${pts[pts.length-1][0]} ${y(0)} Z`:'';
  const id=mini?'tl':'dv';
  let s=`<defs><clipPath id="${id}Up"><rect x="0" y="0" width="${W}" height="${y(0)}"/></clipPath><clipPath id="${id}Dn"><rect x="0" y="${y(0)}" width="${W}" height="${H}"/></clipPath><clipPath id="${id}Plot"><rect x="${m.l}" y="${m.t-8}" width="${W-m.l-m.r}" height="${pb-m.t+8}"/></clipPath>
    <linearGradient id="${id}G" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--color-accent)" stop-opacity=".55"/><stop offset="1" stop-color="var(--color-accent)" stop-opacity=".05"/></linearGradient>
    <pattern id="${id}Hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--color-rule)" stroke-width="2" opacity=".55"/></pattern></defs>`;
  const sp=g.spike||{};if(sp.from)s+=`<rect x="${x(sp.from)}" y="${m.t-8}" width="${x(sp.to)-x(sp.from)}" height="${pb-m.t+8}" fill="var(--color-accent)" opacity="${mini?.14:.1}"/><text class="lbl-acc" x="${(x(sp.from)+x(sp.to))/2}" y="${m.t-12}" text-anchor="middle">SPIKE</text>`;
  if(!mini){const step=top>2?1:top>1?.5:.25;for(let v=-Math.floor(top/step)*step;v<=top+1e-9;v+=step){const vv=Math.round(v*100)/100;
    s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(vv)}" y2="${y(vv)}" stroke="var(--color-rule)" stroke-opacity="${vv===0?1:.45}" ${vv===0?'stroke-width="1.5"':''}/><text x="${m.l-8}" y="${y(vv)+4}" text-anchor="end">${vv===0?'0':sg(vv,step<.5?2:1)}</text>`}}
  else s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--color-rule)" stroke-width="1.5"/>`;
  // what up and down mean, written in the plot (right of the removed laning phase)
  const laneNW=nwAt(nwq,(g.lane||{}).end_min),xa=(laneNW&&laneNW<X1?x(laneNW):m.l)+6;
  s+=`<text class="lbl-up" x="${xa}" y="${m.t+4}">${L('data.ax_up')}</text><text class="lbl-dn" x="${xa}" y="${pb-6}">${L('data.ax_down')}</text><text x="${W-m.r-4}" y="${y(0)-6}" text-anchor="end">${L('data.ref_zero')}</text>`;
  if(!mini)Object.entries(OBJ).forEach(([k,[glyph,col]],r)=>{const yy=14+r*15;
    s+=`<text x="${m.l-8}" y="${yy+4}" text-anchor="end">${L('data.'+k)}</text><line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" stroke="var(--color-rule)" stroke-opacity=".5"/>`;
    let last=-99;(P.events[k]||[]).forEach(mn=>{const q=nwq[mn];if(!q||q[1]>X1)return;const xm=x(q[1]);
      if(k!=='urn'){s+=`<rect x="${x(q[0])}" y="${yy-2}" width="${Math.max(2,x(Math.min(q[2],X1))-x(q[0]))}" height="4" rx="2" fill="${col}" opacity=".35"/><line x1="${xm}" x2="${xm}" y1="${m.t-8}" y2="${pb}" stroke="${col}" stroke-opacity=".25" stroke-dasharray="2 4"/>`}
      s+=`<text x="${xm}" y="${yy+4}" text-anchor="middle" style="fill:${col};font-size:${k==='urn'?8:11}px">${glyph}</text>`;
      if(xm-last>30){s+=`<text x="${xm+7}" y="${yy-3}" style="font-size:9px">${mn}'</text>`;last=xm}
      s+=`<rect class="dv-obj" x="${xm-8}" y="${yy-8}" width="16" height="16" fill="transparent"${tt(ttBox(`${glyph} ${L('data.'+k)} · ${mn}'`,[],L('data.obj_tip',{min:mn,nw:kS(q[1]),lo:kS(q[0]),hi:kS(q[2])})))}/>`})});
  for(let b=mini?10000:0;b<=60000;b+=10000){const mm=minAt(nwq,b);s+=`${mini?'':`<line x1="${x(b)}" x2="${x(b)}" y1="${pb}" y2="${pb+5}" stroke="var(--color-neutral)"/>`}<text class="lbl-strong" x="${x(b)}" y="${pb+(mini?15:19)}" text-anchor="middle">${b?kS(b):'0'}</text>${mm!=null&&b?`<text x="${x(b)}" y="${pb+(mini?29:34)}" text-anchor="middle">≈ ${nf(mm)}'</text>`:''}`}
  if(!mini)s+=`<text x="${W-m.r}" y="${H-2}" text-anchor="end">${L('data.nw_axis')} · ≈ min</text>`;
  if(laneNW&&laneNW<X1){const xl=x(laneNW);s+=`<rect x="${m.l}" y="${m.t-8}" width="${xl-m.l}" height="${pb-m.t+8}" fill="url(#${id}Hatch)"/><line x1="${xl}" x2="${xl}" y1="${m.t-8}" y2="${pb}" stroke="var(--color-neutral)" stroke-dasharray="3 3"/>
    <text class="lbl-lane" transform="translate(${xl-7} ${(m.t+pb)/2}) rotate(-90)" text-anchor="middle">${L('data.lane_cut')}</text>`}
  if(area)s+=`<path d="${area}" fill="${mini?'var(--color-accent)':`url(#${id}G)`}" ${mini?'opacity=".28"':''} clip-path="url(#${id}Up)"/><path d="${area}" fill="var(--color-neutral)" opacity=".18" clip-path="url(#${id}Dn)"/>`;
  if(o)s+=`<path d="${path(o.fights)}" fill="none" stroke="var(--color-muted)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7" clip-path="url(#${id}Plot)"/>`;
  s+=`<path d="${path(g.fights)}" fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  s+=`<line class="dv-x" y1="${m.t-8}" y2="${pb}" stroke="var(--color-ink)" stroke-opacity=".5" visibility="hidden"/><circle class="dv-dot" r="5" fill="var(--color-accent)" stroke="var(--color-paper-2)" stroke-width="2" visibility="hidden"/>
    <rect class="dv-hit" x="${m.l}" y="${m.t-8}" width="${W-m.l-m.r}" height="${pb-m.t+8}" fill="transparent"/>`;
  return `<div class="dv-chart${mini?' tl-power__chart':''}" data-chart="power" data-grp="${mini?'ranked':'cur'}" data-w="${W}" data-ml="${m.l}" data-mr="${m.r}" data-mt="${m.t}" data-pb="${pb}" data-top="${top}" data-x1="${X1}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L('data.fights_title'))}">${s}</svg><div class="dv-tip" hidden></div></div>`}
// TLDR: when the hero is strong, in souls and minutes, with a small power line
function tlPower(){const P=D.profile,g=P.ranked,sp=g.spike||{};
  const objs=sp.min_from!=null?['rift','boss'].flatMap(k=>(P.events[k]||[]).filter(mn=>mn>=sp.min_from&&mn<=sp.min_to).map(mn=>`${L('data.'+k)} ${mn}'`)):[];
  const type=typeOf(sp);
  return `<div class="tl-power"><div>${sp.from?`<p class="tl-power__v">${L('tl.power_val',{a:kS(sp.from),b:kS(sp.to)})}</p>`:`<p class="tl-power__v tl-power__v--flat">${L('tl.power_flat')}</p>`}
    ${sp.min_from!=null?`<p class="tl-power__s">${L('data.spike_min',{a:nf(sp.min_from),b:nf(sp.min_to)})}${type?` · <span class="dv-badge">${L(type)}</span>`:''}</p>`:''}

  document.querySelectorAll('.pick').forEach(p=>p.setAttribute('aria-current',p.dataset.v===v));
  const cur=document.querySelector('.pick[aria-current=true]'),ul=$('list');
  if(cur&&ul.scrollWidth>ul.clientWidth)ul.scrollLeft=cur.offsetLeft-ul.offsetLeft-16;
  bindTips($('main'));bindCopy();
  document.body.classList.toggle('show-notes',NOTES);
  $('main').querySelectorAll('.notes-btn').forEach(btn=>btn.onclick=()=>{NOTES=!NOTES;try{localStorage.setItem('dl-notes',NOTES?'1':'0')}catch(e){}
    document.body.classList.toggle('show-notes',NOTES);btn.setAttribute('aria-pressed',NOTES)});
  if(push)history.replaceState(null,'','#'+v);
  try{localStorage.setItem('dl-view:'+D.hero.name,v)}catch(e){}}
$('list').addEventListener('click',e=>{const p=e.target.closest('.pick');if(p)show(p.dataset.v,true)});
document.querySelector('.tldr-btn').onclick=()=>show('tldr',true);

/* ---- copy (8 states: default/hover/focus/active/disabled/loading/error/success) ---- */
function bindCopy(){document.querySelectorAll('.copy[data-code]').forEach(btn=>btn.onclick=async()=>{
  const label=btn.dataset.label||L('copy.label');btn.dataset.state='loading';btn.textContent=L('copy.loading');let ok=false;
  try{await navigator.clipboard.writeText(btn.dataset.code);ok=true}catch(e){}
  if(!ok){const t=document.createElement('textarea');t.value=btn.dataset.code;document.body.appendChild(t);t.select();
    try{ok=document.execCommand('copy')}catch(e){}t.remove()}
  btn.dataset.state=ok?'success':'error';btn.textContent=ok?(btn.dataset.ok||L('copy.ok')):L('copy.fail');
  setTimeout(()=>{delete btn.dataset.state;btn.textContent=label},2600)})}

/* ---- tooltips: 250 ms on hover, instant on focus, tap toggles on touch ---- */
const tip=$('tip');let tmr;
function tipAbility(t){const sec=s=>`${s.d?`<div class="d">${s.d}</div>`:''}${s.imp.length?`<div class="tab__imp">${s.imp.map(p=>`<div>${p.scale?`<i title="${L('tip.spirit_scaling')}">✦ ×${p.scale}</i>`:''}<b>${p.v}</b><small>${p.label}</small></div>`).join('')}</div>`:''}
  ${s.basic.length?`<div class="tab__basic">${s.basic.map(p=>`<span><b>${p.v}</b> ${p.label}${p.scale?` <span style="color:var(--color-spirit)">✦×${p.scale}</span>`:''}</span>`).join('')}</div>`:''}`;
  const C=['var(--color-vitality)','var(--color-accent-dim)','var(--color-weapon)'],P=[1,2,5];
  return `<div class="tab"><div class="tab__h"><span class="tn">${esc(t.n)}${t.key?` <kbd>${t.key}</kbd>`:''}</span>${t.cd?`<span class="tab__cd">⟳ ${t.cd}s</span>`:''}</div>
  ${(t.range||t.charges)?`<div class="tab__chips">${t.range?`<span>◎ ${String(t.range).replace(/\s*m$/,'')} m</span>`:''}${t.charges?`<span>${t.charges} ${L('tip.charges')}</span>`:''}</div>`:''}
  ${t.secs.map(sec).join('<div class="sep"></div>')}
  ${t.ups&&t.ups.some(Boolean)?`<div class="tab__ups">${t.ups.map((u,k)=>`<div style="--c:${C[k]}"><b>◆ ${P[k]}</b>${esc(u)||'—'}</div>`).join('')}</div>`:''}
  ${t.secs.some(s=>s.imp.concat(s.basic).some(p=>p.scale))?`<div style="margin-top:6px;font-size:var(--text-xs);color:var(--color-neutral)">✦ ×N = ${L('tip.per_point')}</div>`:''}</div>`}
/* ---- item evolutions: what an item is built from and what it evolves into; its family glows on hover ---- */
function upChains(id,seen=new Set()){const up=(T(id).up||[]).filter(u=>!seen.has(u));if(!up.length)return[[id]];seen.add(id);
  return up.flatMap(u=>upChains(u,new Set(seen)).map(c=>[id,...c]))}
function famOf(id){const out=new Set(),todo=[+id];while(todo.length){const x=todo.pop();if(out.has(x))continue;out.add(x);const t=T(x);todo.push(...(t.from||[]),...(t.up||[]))}return out}
const evoRef=id=>`<span class="evo__i ${esc(T(id).slot||'')}">${T(id).icon?`<img src="${esc(T(id).icon)}" alt="">`:''}${esc(T(id).n||id)}<small>T${T(id).tier||'?'}</small></span>`;
function evoHtml(id){const t=T(id);if(t.ab||!t.tier)return'';let h='';
  if((t.from||[]).length)h+=`<div class="evo__k">${L('evo.from')}</div><div class="evo__l">${t.from.map(evoRef).join('<i>+</i>')}</div>`;
  if((t.up||[]).length)h+=`<div class="evo__k">${L('evo.up')}</div>`+upChains(+id).map(c=>`<div class="evo__l">${c.slice(1).map(evoRef).join('<i>→</i>')}</div>`).join('');
  else{const k=t.tier>=4?'evo.final':t.tier===1&&!(t.from||[]).length?'evo.lane':'evo.none';
    h+=`<div class="evo__k">${L(k)}</div><div class="evo__n">${L(k+'_desc')}</div>`}
  return h?`<div class="sep"></div><div class="evo">${h}</div>`:''}
function famOn(id){const f=famOf(id);if(f.size<2)return;document.body.classList.add('fam-on');
  document.querySelectorAll('main [data-id]').forEach(el=>{const x=+el.dataset.id;if(f.has(x))el.classList.add(x===+id?'fam-self':'fam')})}
function famOff(){document.body.classList.remove('fam-on');document.querySelectorAll('.fam,.fam-self').forEach(el=>el.classList.remove('fam','fam-self'))}
function tipHtml(t){if(t.ab)return tipAbility(t);let h=`<div class="h ${esc(t.slot)}"><img src="${esc(t.img||'')}" alt=""><div><div class="tn">${esc(t.n)}`
  +(t.key?`<span class="tg">${L('tip.ability')} ${t.key}${t.key===4?L('tip.ult'):''}</span>`:'')+(t.act?`<span class="tg">${L('tip.active')}</span>`:'')+'</div>'+(t.c?`<div class="tc num">${t.c} ${L('souls')}</div>`:'')+'</div></div><div class="b">';
  const st=l=>l.map(x=>`<div class="st"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
  if(t.innate.length)h+=st(t.innate);
  t.blocks.forEach((b,k)=>{if(k||t.innate.length)h+='<div class="sep"></div>';if(b.d)h+=`<div class="d">${b.d}</div>`;h+=st(b.s)});
  if(t.imb)h+=`<div class="sep"></div><div class="evo"><div class="evo__k">◆ ${L('imb.k')}</div><div class="evo__n">${L('imb.desc')}</div></div>`;
  return h+evoHtml(t._id)+'</div>'}
function place(x,y){const r=tip.getBoundingClientRect();let l=x+16,t=y+16;
  if(l+r.width>innerWidth-8)l=x-r.width-16;if(t+r.height>innerHeight-8)t=Math.max(8,innerHeight-r.height-8);
  tip.style.left=Math.max(8,l)+'px';tip.style.top=t+'px'}
function open(el,x,y){if(!IT[el.dataset.id])return;const t=T(el.dataset.id);tip.innerHTML=(el.dataset.note?`<div class="tnote"><b>${L('tip.author_note')}</b>${esc(el.dataset.note)}</div>`:'')+tipHtml(t);tip.style.display='block';
  if(x==null){const r=el.getBoundingClientRect();x=r.right;y=r.top}place(x,y)}
function hide(){clearTimeout(tmr);tip.style.display='none'}
function heroTip(el){const h=HN(el.dataset.hero);const CL=CLS;
  return `<div class="tab"><div class="tab__h" style="justify-content:flex-start;gap:10px">${h.img?`<img src="${esc(h.img)}" alt="" style="width:40px;height:40px;border-radius:50%;background:${esc(h.color||'var(--color-shade)')}">`:''}
  <span><span class="tn">${esc(h.n)}</span>${h.type?`<br><small style="color:var(--color-muted)">${CL[h.type]||esc(h.type)}</small>`:''}</span></div>
  ${el.dataset.mu?`<div class="d" style="margin-bottom:0">${esc(el.dataset.mu)}</div>`:el.dataset.games?`<div class="d" style="margin-bottom:0">${L('tip.games_vs',{n:esc(el.dataset.games)})}</div>`:''}</div>`}
function bindHero(root){root.querySelectorAll('[data-hero]').forEach(el=>{
  const o=(x,y)=>{tip.innerHTML=heroTip(el);tip.style.display='block';if(x==null){const r=el.getBoundingClientRect();x=r.left;y=r.bottom}place(x,y)};
  el.addEventListener('mouseenter',e=>{clearTimeout(tmr);tmr=setTimeout(()=>o(e.clientX,e.clientY),120)});
  el.addEventListener('mousemove',e=>{if(tip.style.display==='block')place(e.clientX,e.clientY)});
  el.addEventListener('focus',()=>o());el.addEventListener('click',()=>{tip.style.display==='block'?hide():o()});
  ['mouseleave','blur'].forEach(n=>el.addEventListener(n,hide))})}
function bindPos(root){bindHero(root);root.querySelectorAll('[data-pos]').forEach(el=>{
  const o=(x,y)=>{tip.innerHTML=posTip(+el.dataset.pos);tip.style.display='block';if(x==null){const r=el.getBoundingClientRect();x=r.left;y=r.bottom}place(x,y)};
  el.addEventListener('mouseenter',e=>{clearTimeout(tmr);tmr=setTimeout(()=>o(e.clientX,e.clientY),150)});
  el.addEventListener('mousemove',e=>{if(tip.style.display==='block')place(e.clientX,e.clientY)});
  el.addEventListener('focus',()=>o());el.addEventListener('click',()=>{tip.style.display==='block'?hide():o()});
  ['mouseleave','blur'].forEach(n=>el.addEventListener(n,hide))})}
function bindTT(root){root.querySelectorAll('[data-tt]').forEach(el=>{
  const o=(x,y)=>{tip.innerHTML=`<div class="ttc">${el.dataset.tt}</div>`;tip.style.display='block';if(x==null){const r=el.getBoundingClientRect();x=r.left;y=r.bottom}place(x,y)};
  el.addEventListener('mouseenter',e=>{clearTimeout(tmr);tmr=setTimeout(()=>o(e.clientX,e.clientY),80)});
  el.addEventListener('mousemove',e=>{if(tip.style.display==='block')place(e.clientX,e.clientY)});
  el.addEventListener('focus',()=>o());el.addEventListener('click',()=>{tip.style.display==='block'?hide():o()});
  ['mouseleave','blur'].forEach(n=>el.addEventListener(n,hide))})}
function bindTips(root){bindPos(root);bindTT(root);root.querySelectorAll('[data-id]').forEach(el=>{
  el.addEventListener('mouseenter',()=>famOn(el.dataset.id));el.addEventListener('focus',()=>famOn(el.dataset.id));
  ['mouseleave','blur'].forEach(n=>el.addEventListener(n,famOff));
  el.addEventListener('mouseenter',e=>{clearTimeout(tmr);tmr=setTimeout(()=>open(el,e.clientX,e.clientY),250)});
  el.addEventListener('mousemove',e=>{if(tip.style.display==='block')place(e.clientX,e.clientY)});
  el.addEventListener('focus',()=>open(el));
  el.addEventListener('click',e=>{if(matchMedia('(pointer:coarse)').matches){tip.style.display==='block'?hide():open(el)}});
  ['mouseleave','blur'].forEach(n=>el.addEventListener(n,hide))})}
addEventListener('scroll',hide,{passive:true});

let start=location.hash.slice(1);
if(!views.includes(start)){try{start=localStorage.getItem('dl-view:'+D.hero.name)||''}catch(e){start=''}}
/* language switch: keep the current view when moving to the other language's page */
document.querySelectorAll('.lang a').forEach(a=>a.addEventListener('click',()=>{a.href=a.getAttribute('href').split('#')[0]+location.hash}));
if(D.contentFallback){const n=document.createElement('p');n.className='rail__note';n.textContent=L('content.fallback');$('introBox').before(n)}
renderFresh();renderRail();bindTips($('intro'));
show(start||views[0],false);
/* live check: did a patch come out after this page was generated? (API allows CORS) */
fetch('https://api.deadlock-api.com/v2/patches').then(r=>{if(!r.ok)throw 0;return r.json()}).then(list=>{LIVE='ok';
  const known=new Set(P.map(p=>Math.floor(p.t/DAY)));let added=0;
  for(const x of list){if(!/update|\d{2}-\d{2}-\d{4}|gameplay|patch/i.test(x.title||''))continue;
    const t=Date.parse(x.pub_date)/1000,d=Math.floor(t/DAY);if(known.has(d)||known.has(d-1)||known.has(d+1))continue;
    known.add(d);P.push({t,title:x.title.trim(),big:false});added++}
  renderFresh();if(added){const v=document.querySelector('.pick[aria-current=true]')?.dataset.v;renderRail();show(v||views[0],false)}
}).catch(()=>{LIVE='fail';renderFresh()});
</script>
